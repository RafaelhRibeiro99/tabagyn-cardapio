{% extends "base.html" %}{% block body %}<div class="admin-layout"><aside><div class="brand">TABAGYN</div><a href="/admin">Dashboard</a><a href="/admin/categorias">Categorias</a><a href="/admin/produtos">Produtos</a><a href="/admin/sabores">Sabores</a><a href="/admin/happy-hour">Happy Hour</a><a href="/admin/usuarios">Usuários</a><a href="/pedidos">Pedidos</a><a href="/logout">Sair</a></aside><main class="admin-main"><h1>Happy Hour</h1><form class="panel form-grid" method="post"><input name="name" placeholder="Nome da promoção" required><input name="weekdays" placeholder="Dias: 0,1,2,3,4 (segunda=0)" required><input name="start_time" type="time" required><input name="end_time" type="time" required><select name="product_id">{% for p in products %}<option value="{{p.id}}">{{p.name}}</option>{% endfor %}</select><input name="promotional_price" type="number" step="0.01" placeholder="Preço promocional" required><button>Cadastrar Happy Hour</button></form><div class="table">{% for x in promos %}<div class="row"><b>{{x.name}}</b><span>{{x.start_time}} às {{x.end_time}} • dias {{x.weekdays}}</span></div>{% endfor %}</div></main></div>{% endblock %}
