{% extends "base.html" %}{% block body %}<div class="admin-layout"><aside><div class="brand">TABAGYN</div><a href="/admin">Dashboard</a><a href="/admin/categorias">Categorias</a><a href="/admin/produtos">Produtos</a><a href="/admin/sabores">Sabores</a><a href="/admin/happy-hour">Happy Hour</a><a href="/admin/usuarios">Usuários</a><a href="/pedidos">Pedidos</a><a href="/logout">Sair</a></aside><main class="admin-main"><h1>Produtos</h1><form class="panel form-grid" method="post" enctype="multipart/form-data"><input name="name" placeholder="Nome" required><select name="category_id">{% for c in categories %}<option value="{{c.id}}">{{c.name}}</option>{% endfor %}</select><input name="price" type="number" step="0.01" placeholder="Preço" required><input name="description" placeholder="Descrição"><input name="image" type="file" accept="image/*"><label><input type="checkbox" name="is_session" value="true"> É uma sessão</label><button>Cadastrar produto</button></form><div class="table">{% for x in items %}<div class="row"><b>{{x.name}}</b><span>R$ {{x.price}} {% if x.is_session %}• Sessão{% endif %}</span><form method="post" action="/admin/produtos/{{x.id}}/disponibilidade"><button>{{"Esgotar" if x.available else "Disponibilizar"}}</button></form></div>{% endfor %}</div></main></div>{% endblock %}
